<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f7;--ink:#0a0a0a;--tile:#fff;--muted:#9a9a9a;--dot:#bdbdbd;--dotOn:#3a3a3a;--panel:#efefef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--ink:#f2f2f2;--tile:#1e1e1e;--muted:#6b6b6b;--dot:#444;--dotOn:#ddd;--panel:#161616;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111;--ink:#f2f2f2;--tile:#1e1e1e;--muted:#6b6b6b;--dot:#444;--dotOn:#ddd;--panel:#161616;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
.pager{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;padding:24px 28px;display:flex;flex-direction:column}
.p1{justify-content:center}
.manifesto{max-width:340px;padding-left:6px}
.manifesto p{font-size:26px;font-weight:500;letter-spacing:-.025em;line-height:1.38;margin:0 0 22px;color:var(--ink)}
.manifesto p:last-child{margin-bottom:0;font-weight:600}
.p2{justify-content:center}
.list{background:var(--panel);border-radius:22px;padding:18px 16px}
.list button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:500 18px/1.2 Inter,sans-serif;padding:13px 0;cursor:pointer}
.list button.done{color:var(--muted);text-decoration:line-through}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.tile{background:var(--tile);border:0;border-radius:22px;aspect-ratio:1/1;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:10px;color:var(--ink);font:600 15px/1.2 Inter,sans-serif;text-align:left;cursor:pointer}
.tile svg{width:24px;height:24px;fill:currentColor}
.dots{display:flex;justify-content:center;gap:9px;padding:10px 0 16px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dot);transition:background .2s;cursor:pointer}
.dots i.on{background:var(--dotOn)}
.dock{display:flex;justify-content:center;gap:16px;padding:0 20px 14px}
.dock a{width:64px;height:64px;border-radius:18px;background:var(--tile);display:grid;place-items:center;color:var(--ink);text-decoration:none}
.dock svg{width:32px;height:32px}
.sc{position:fixed;inset:0;z-index:20;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateY(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility .35s;color:#2a2320;font-family:Inter,-apple-system,Arial,sans-serif;color-scheme:light}
.sc.open{transform:none;visibility:visible}
.t-dune{background:linear-gradient(#f4e9de,#e6d2c0)}.t-list{background:#e6e3dc}.t-tl{background:linear-gradient(160deg,#eee4e2,#decfcc)}
.sc button{font-family:inherit;color:inherit;cursor:pointer}
.bk{background:none;border:0;font-size:28px;line-height:1;padding:0}
.sc h2{font-size:15px;font-weight:500;margin:22px 0 4px;letter-spacing:.02em}.sub{font-size:12px;color:#7a766d;margin-bottom:18px}
.ix{list-style:none;margin:0;padding:0;border-top:1px solid #1a1a1a}.ix li{display:flex;justify-content:space-between;align-items:center;padding:17px 6px;border-bottom:1px solid #1a1a1a;font-size:15px;cursor:pointer;transition:background .2s}.ix li em{font-style:normal;font-size:12px;color:#7a766d}.ix li.on{background:#6fe38f}.ix li.on em{color:#1a1a1a}
.add{display:flex;gap:10px;margin-top:22px}.add input{flex:1;background:none;border:0;border-bottom:1px solid #1a1a1a;font:15px Inter,sans-serif;padding:8px 2px;outline:0;color:#1a1a1a}.add button{background:#1a1a1a;color:#e6e3dc;border:0;border-radius:6px;padding:0 18px;font-size:14px}
.tl{list-style:none;margin:30px 0 0;padding:0 0 0 52px;position:relative}.tl:before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:1.5px;background:#4a3f3d}.tl li{position:relative;font-size:22px;font-weight:300;padding:15px 0;cursor:pointer}.tl li:before{content:"";position:absolute;left:-47px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08);transition:box-shadow .25s}.tl li.on{font-weight:600}.tl li.on:before{box-shadow:0 0 0 7px rgba(255,255,255,.7),0 2px 8px rgba(0,0,0,.18)}
.t-tl h2{font-size:13px;font-weight:300;margin:26px 0 0 52px;color:#6d605e}
.jt{font-size:34px;letter-spacing:.06em;text-align:center;margin-top:36px}.js{font-size:13px;font-weight:300;text-align:center;color:#7a6a67;margin:6px 0 20px}
.sc textarea{width:100%;height:46vh;background:transparent;border:0;border-top:1px solid rgba(0,0,0,.15);padding:16px 2px;font:300 18px/1.6 Inter,sans-serif;color:#2a2320;outline:0;resize:none}
.jb{display:flex;border-top:1px solid rgba(0,0,0,.15)}.jb button{flex:1;background:none;border:0;padding:18px;font-size:15px;font-weight:300}
.top{display:flex;justify-content:space-between;align-items:center}.av{width:36px;height:36px;border-radius:50%;background:#2b1710;color:#f4e9de;display:grid;place-items:center;font-size:14px}
.tb{font-size:13px;color:#7b6556;margin-top:26px}.bal{font-size:46px;font-weight:500;letter-spacing:-.03em;margin:4px 0 0}.bal small{font-size:14px;font-weight:400;color:#7b6556;margin-left:4px}
.acts{display:flex;gap:12px;margin:22px 0 26px}.acts button{flex:1;height:52px;border-radius:26px;border:0;background:#f9f2eb;font-size:20px}.acts button:last-child{background:#2b1710;color:#fff}
.fv{font-size:15px;font-weight:500;margin-bottom:12px}.fr{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.55);border-radius:18px;padding:13px 14px;margin-bottom:10px}.fr i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 15px Inter,sans-serif;font-style:normal}.fr b{flex:1;font-size:15px;font-weight:500}.fr span{font-size:14px;font-weight:500}.fr svg{width:64px;height:22px;fill:none;stroke:#2b1710;stroke-width:1.6}
</style>
</head>
<body>
<div class="pager" id="pager">
  <section class="page p1">
    <div class="manifesto">
      <p>I wrote a woman who finally chooses.</p>
      <p>You may not like how much of you is in her, or how long you've been waiting to be her.</p>
      <p>She's done waiting. You don't have to be.</p>
    </div>
  </section>
  <section class="page p2">
    <div class="list" id="list">
      <button>Chapter 1 — The Ultimatum</button>
      <button>Chapter 2 — Packed Bags</button>
      <button>Chapter 3 — Unanswered Calls</button>
      <button>Chapter 4 — First Morning Alone</button>
      <button class="done">Prologue — Before the Choice</button>
      <button class="done">Character Dossier</button>
    </div>
  </section>
  <section class="page p3">
    <div class="grid" style="margin-top:0">
      <button class="tile"><svg viewBox="0 0 24 24"><path d="M7 2h12a1 1 0 0 1 1 1v15H8a1 1 0 0 0 0 2h12v2H8a3 3 0 0 1-3-3V4a2 2 0 0 1 2-2z"/></svg>Chapters</button>
      <button class="tile"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>Characters</button>
      <button class="tile"><svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm4.5 12.5L17 8l-1.4-1.4-6.1 6.1-2.1-2.1L6 12.1z" fill-rule="evenodd"/></svg>Story Arc</button>
      <button class="tile"><svg viewBox="0 0 24 24"><path d="M3 21l1-5L16 4l4 4L8 20zM17.5 2.5l2-.5 2 2-.5 2z"/></svg>Reader Notes</button>
      <button class="tile"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>Key Scenes</button>
      <button class="tile"><svg viewBox="0 0 24 24"><path d="M12 2L15 8l6 1-4.5 4.3L17.6 20 12 17l-5.6 3 1.1-6.7L3 9l6-1z"/></svg>Pre-Order</button>
    </div>
  </section>
</div>
<div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>
<nav class="dock">
  <a href="#" data-open="Chapters" aria-label="Read Sample"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 6h18a3 3 0 0 1 3 3v21H10a3 3 0 0 0-3 3V6z"/><path d="M7 27h21"/></svg></a>
  <a href="#" data-open="Story Arc" aria-label="Timeline"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="18" cy="18" r="12"/><path d="M18 11v7l5 3"/></svg></a>
  <a href="#" data-open="Reader Notes" aria-label="Notes"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 28l2-7L23 8l5 5-13 13z"/></svg></a>
  <a href="#" data-open="Pre-Order" aria-label="Get the Book"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 13h18l-1.5 16h-15z"/><path d="M14 13V10a4 4 0 0 1 8 0v3"/></svg></a>
</nav>
<script>
var pager=document.getElementById('pager'),dots=document.querySelectorAll('#dots i');
pager.addEventListener('scroll',function(){var n=Math.round(pager.scrollLeft/pager.clientWidth);dots.forEach(function(d,i){d.classList.toggle('on',i===n)})});
dots.forEach(function(d,i){d.addEventListener('click',function(){pager.scrollTo({left:i*pager.clientWidth,behavior:'smooth'})})});
document.getElementById('list').addEventListener('click',function(e){if(e.target.tagName==='BUTTON')e.target.classList.toggle('done')});
document.querySelectorAll('a[href="#"]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();if(a.dataset.open)openScreen(a.dataset.open)})});
</script>
<div class="sc" id="sc"></div>
<script>
var sc=document.getElementById('sc'),copies=1420;
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var L={'Chapters':[['Prologue: Before the Choice','4 min read'],['Chapter 1: The Ultimatum','9 min read'],['Chapter 2: Packed Bags','11 min read'],['Chapter 3: Unanswered Calls','8 min read'],['Chapter 4: First Morning Alone','12 min read']],
'Characters':[['Her','The woman who finally chooses'],['Him','Still waiting on the old version'],['The Friend','The one who knew first'],['The City','Where she starts over']]};
var T={'Story Arc':['The Silence','The Breaking Point','The Decision','The Departure','The Reckoning','The Becoming'],'Key Scenes':['The kitchen table conversation','Leaving the keys on the counter','The 2:00 AM train','Blocking the number','First breath in the new apartment','Looking back once']};
var F=[['Hardcover Edition','H','#2b1710','$28.00',[3,5,6,8,9,10]],['Signed First Print','S','#7b6556','$36.00',[4,6,8,9,10,10]],['Digital E-Book','E','#4a3f3d','$14.99',[2,4,5,7,8,9]],['Audiobook (Author Narrated)','A','#9a7b66','$24.99',[3,4,6,7,9,10]]];
function spark(a){return '<svg viewBox="0 0 64 22"><polyline points="'+a.map(function(v,i){return i*12.8+','+(21-v*2)}).join(' ')+'"/></svg>'}
function show(cls,html){sc.className='sc t-'+cls;sc.innerHTML=html;void sc.offsetHeight;sc.classList.add('open')}
function fmt(n){return n.toLocaleString('en-US')}
function openScreen(n){
 if(L[n]){show('list','<button class="bk" data-x>←</button><h2>'+n+'</h2><div class="sub">'+L[n].length+' entries · tap to mark read</div><ul class="ix">'+L[n].map(function(r){return '<li><span>'+esc(r[0])+'</span><em>'+esc(r[1])+'</em></li>'}).join('')+'</ul><div class="add"><input placeholder="Add note or bookmark"><button class="ad">Add</button></div>')}
 else if(T[n]){show('tl','<button class="bk" data-x>×</button><h2>'+n+'</h2><ol class="tl">'+T[n].map(function(s,i){return '<li'+(i==0?' class="on"':'')+'>'+s+'</li>'}).join('')+'</ol>')}
 else if(n==='Reader Notes'){var v='';try{v=localStorage.getItem('jr')||''}catch(e){}
  show('tl','<button class="bk" data-x>×</button><div class="jt">REFLECTIONS</div><div class="js">What resonated with you?</div><textarea placeholder="Write your thoughts on the story...">'+esc(v)+'</textarea><div class="jb"><button data-j="c">Clear</button><button data-j="s">Save</button></div>')}
 else if(n==='Pre-Order'){show('dune','<div class="top"><div class="av">1st</div><button class="bk" data-x>×</button></div><div class="tb">Early Readers</div><div class="bal" id="bal">'+fmt(copies)+'<small>copies reserved</small></div><div class="acts"><button>↗</button><button>♡</button><button>✎</button><button data-p>+1</button></div><div class="fv">Available Editions</div>'+F.map(function(f){return '<div class="fr"><i style="background:'+f[2]+'">'+f[1]+'</i><b>'+f[0]+'</b>'+spark(f[4])+'<span>'+f[3]+'</span></div>'}).join(''))}
}
document.addEventListener('click',function(e){var t=e.target,x;
 if(x=t.closest('.tile')){openScreen(x.textContent.trim());return}
 if(t.closest('[data-x]')){sc.classList.remove('open');return}
 if(x=t.closest('.ix li, .tl li')){x.classList.toggle('on');return}
 if(t.closest('.ad')){var i=sc.querySelector('.add input'),v=i.value.trim();if(v){var li=document.createElement('li');li.innerHTML='<span>'+esc(v)+'</span><em>saved</em>';sc.querySelector('.ix').appendChild(li);i.value=''}return}
 if(x=t.closest('[data-j]')){var ta=sc.querySelector('textarea');if(x.dataset.j==='c')ta.value='';try{localStorage.setItem('jr',ta.value)}catch(e){}if(x.dataset.j==='s'){x.textContent='Saved';setTimeout(function(){x.textContent='Save'},1200)}return}
 if(t.closest('[data-p]')){copies+=1;document.getElementById('bal').innerHTML=fmt(copies)+'<small>copies reserved</small>'}
});
</script>
</body>
</html>
