<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Ash Mode (Light) */
  --bg:#ededed;
  --bg-grad:linear-gradient(165deg,#f5f5f5,#e4e4e4);
  --ink:#111111;
  --tile:#f8f8f8;
  --muted:#7d7d7d;
  --dot:#c2c2c2;
  --dotOn:#111111;
  --panel:#f7f7f7;
  --accent:#111111;
  --accent-ink:#f5f5f5;
  --line:rgba(17,17,17,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    /* Pinkish / Warm Espresso-Sand Mode (Dark) */
    --bg:#f4e9de;
    --bg-grad:linear-gradient(165deg,#f6ece3,#e8d6c8);
    --ink:#2b1710;
    --tile:#fbf5ef;
    --muted:#7b6556;
    --dot:#cfb9aa;
    --dotOn:#2b1710;
    --panel:#fbf5ef;
    --accent:#2b1710;
    --accent-ink:#f4e9de;
    --line:rgba(43,23,16,.15);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#f4e9de;
  --bg-grad:linear-gradient(165deg,#f6ece3,#e8d6c8);
  --ink:#2b1710;
  --tile:#fbf5ef;
  --muted:#7b6556;
  --dot:#cfb9aa;
  --dotOn:#2b1710;
  --panel:#fbf5ef;
  --accent:#2b1710;
  --accent-ink:#f4e9de;
  --line:rgba(43,23,16,.15);
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;
  margin:0;
  background:#191615;
  color:var(--ink);
  font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;
}

/* 3D Cube Stage */
.stage{
  position:relative;
  width:100%;
  height:100%;
  perspective:1400px;
  overflow:hidden;
}
.cube{
  position:relative;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.22,.82,.24,1);
  transform:translateZ(-50vw) rotateY(0deg);
}
.cube.turned{
  transform:translateZ(-50vw) rotateY(-90deg);
}
.face{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:var(--bg-grad);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
.face-front{
  transform:rotateY(0deg) translateZ(50vw);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 28px;
}
.face-right{
  transform:rotateY(90deg) translateZ(50vw);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* Pure Typographic Cover */
.cover-copy{
  max-width:340px;
  width:100%;
  cursor:pointer;
  user-select:none;
  transition:opacity .25s ease, transform .25s ease;
}
.cover-copy:active{
  opacity:.72;
  transform:scale(.99);
}
.cover-copy p{
  margin:0;
  font-size:26px;
  font-weight:500;
  letter-spacing:-.025em;
  line-height:1.38;
  color:var(--ink);
}
.cover-copy p + p{
  margin-top:14px;
}

/* Inner Novel Pages */
.top-nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 22px 4px;
}
.back-cover{
  background:none;
  border:0;
  color:var(--ink);
  font-size:24px;
  line-height:1;
  padding:4px 0;
  cursor:pointer;
}
.mode-dot{
  width:14px;
  height:14px;
  border-radius:50%;
  border:1.5px solid var(--ink);
  background:var(--accent);
  cursor:pointer;
  padding:0;
}

.pager{
  flex:1;
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  min-height:0;
}
.pager::-webkit-scrollbar{display:none}
.page{
  flex:0 0 100%;
  scroll-snap-align:start;
  padding:16px 22px 24px;
  display:flex;
  flex-direction:column;
}
.p1{justify-content:center}
.p1 a{
  font-size:32px;
  font-weight:500;
  letter-spacing:-.02em;
  line-height:1.55;
  color:var(--ink);
  text-decoration:none;
  padding-left:10px;
}
.p2{justify-content:center}
.list{
  background:var(--panel);
  border-radius:22px;
  padding:18px 18px;
}
.list button{
  display:block;
  width:100%;
  text-align:left;
  background:none;
  border:0;
  color:var(--ink);
  font:500 17px/1.25 Inter,sans-serif;
  padding:13px 0;
  cursor:pointer;
}
.list button.done{
  color:var(--muted);
  text-decoration:line-through;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin:auto 0;
}
.tile{
  background:var(--tile);
  border:0;
  border-radius:22px;
  aspect-ratio:1/1;
  padding:16px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:flex-start;
  gap:10px;
  color:var(--ink);
  font:600 15px/1.2 Inter,sans-serif;
  text-align:left;
  cursor:pointer;
}
.tile svg{width:24px;height:24px;fill:currentColor}
.dots{
  display:flex;
  justify-content:center;
  gap:9px;
  padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 18px);
}
.dots i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--dot);
  transition:background .2s;
  cursor:pointer;
}
.dots i.on{background:var(--dotOn)}

/* Slide-up Sub-screens */
.sc{
  position:fixed;
  inset:0;
  z-index:20;
  overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);
  transform:translateY(100%);
  visibility:hidden;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility .35s;
  color:var(--ink);
  background:var(--bg-grad);
  font-family:Inter,-apple-system,Arial,sans-serif;
}
.sc.open{transform:none;visibility:visible}
.sc button{font-family:inherit;color:inherit;cursor:pointer}
.bk{background:none;border:0;font-size:28px;line-height:1;padding:0}
.sc h2{font-size:15px;font-weight:500;margin:22px 0 4px;letter-spacing:.02em}
.sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.ix{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ix li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:17px 6px;
  border-bottom:1px solid var(--line);
  font-size:15px;
  cursor:pointer;
  transition:background .2s;
}
.ix li em{font-style:normal;font-size:12px;color:var(--muted)}
.ix li.on{background:var(--accent);color:var(--accent-ink)}
.ix li.on em{color:var(--accent-ink);opacity:.8}
.add{display:flex;gap:10px;margin-top:22px}
.add input{
  flex:1;
  background:none;
  border:0;
  border-bottom:1px solid var(--ink);
  font:15px Inter,sans-serif;
  padding:8px 2px;
  outline:0;
  color:var(--ink);
}
.add button{
  background:var(--accent);
  color:var(--accent-ink);
  border:0;
  border-radius:6px;
  padding:0 18px;
  font-size:14px;
}
.tl{list-style:none;margin:30px 0 0;padding:0 0 0 52px;position:relative}
.tl:before{
  content:"";
  position:absolute;
  left:11px;
  top:14px;
  bottom:14px;
  width:1.5px;
  background:var(--ink);
  opacity:.45;
}
.tl li{position:relative;font-size:21px;font-weight:300;padding:15px 0;cursor:pointer}
.tl li:before{
  content:"";
  position:absolute;
  left:-47px;
  top:50%;
  width:11px;
  height:11px;
  margin-top:-5.5px;
  border-radius:50%;
  background:var(--tile);
  box-shadow:0 0 0 1px var(--line);
  transition:box-shadow .25s;
}
.tl li.on{font-weight:600}
.tl li.on:before{box-shadow:0 0 0 7px rgba(255,255,255,.5),0 2px 8px rgba(0,0,0,.18)}
.t-tl h2{font-size:13px;font-weight:300;margin:26px 0 0 52px;color:var(--muted)}
.jt{font-size:30px;letter-spacing:.06em;text-align:center;margin-top:30px}
.js{font-size:13px;font-weight:300;text-align:center;color:var(--muted);margin:6px 0 20px}
.sc textarea{
  width:100%;
  height:46vh;
  background:transparent;
  border:0;
  border-top:1px solid var(--line);
  padding:16px 2px;
  font:300 18px/1.6 Inter,sans-serif;
  color:var(--ink);
  outline:0;
  resize:none;
}
.jb{display:flex;border-top:1px solid var(--line)}
.jb button{flex:1;background:none;border:0;padding:18px;font-size:15px;font-weight:300}
.excerpt-body{
  margin-top:18px;
  font-size:17px;
  font-weight:300;
  line-height:1.75;
  border-top:1px solid var(--line);
  padding-top:20px;
}
.excerpt-body p{margin:0 0 18px}
.top{display:flex;justify-content:space-between;align-items:center}
.av{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--accent);
  color:var(--accent-ink);
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:500;
}
.tb{font-size:13px;color:var(--muted);margin-top:26px}
.bal{font-size:44px;font-weight:500;letter-spacing:-.03em;margin:4px 0 0}
.bal small{font-size:14px;font-weight:400;color:var(--muted);margin-left:4px}
.acts{display:flex;gap:12px;margin:22px 0 26px}
.acts button{
  flex:1;
  height:52px;
  border-radius:26px;
  border:0;
  background:var(--tile);
  color:var(--ink);
  font-size:18px;
}
.acts button:last-child{background:var(--accent);color:var(--accent-ink)}
.fv{font-size:15px;font-weight:500;margin-bottom:12px}
.fr{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--tile);
  border-radius:18px;
  padding:13px 14px;
  margin-bottom:10px;
}
.fr i{
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--accent);
  color:var(--accent-ink);
  font:600 14px Inter,sans-serif;
  font-style:normal;
}
.fr b{flex:1;font-size:15px;font-weight:500}
.fr span{font-size:14px;font-weight:500}
.fr svg{width:64px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.6}
</style>
</head>
<body>

<div class="stage">
  <div class="cube" id="cube">

    <!-- FRONT FACE: Pure Homepage Text Only -->
    <main class="face face-front" id="frontFace">
      <div class="cover-copy" id="coverTrigger" role="button" tabindex="0" aria-label="Enter the novel">
        <p>a woman who finally chooses.</p>
        <p>You may not like how much of you is in her, or how long you’ve been waiting to be her.</p>
        <p>She’s done waiting. You don’t have to be.</p>
      </div>
    </main>

    <!-- RIGHT FACE: Rest of the Novel Pages -->
    <section class="face face-right" aria-label="Novel Pages">
      <div class="top-nav">
        <button class="back-cover" id="toCover" aria-label="Back to cover">←</button>
        <button class="mode-dot" id="themeToggle" aria-label="Switch color mode" title="Switch Ash / Warm Sand"></button>
      </div>

      <div class="pager" id="pager">
        <!-- Page 1: Novel Navigation -->
        <section class="page p1">
          <a href="#" data-open="Excerpt">Excerpt</a>
          <a href="#" data-open="Chapters">Chapters</a>
          <a href="#" data-open="Characters">Characters</a>
          <a href="#" data-open="Notes">Author Notes</a>
          <a href="#" data-open="Order">Get the Book</a>
        </section>

        <!-- Page 2: Reader Check-in / Themes -->
        <section class="page p2">
          <div class="list" id="list">
            <button>Chapter I — The Quiet Before</button>
            <button>Chapter II — What She Kept</button>
            <button>Chapter III — The Line Drawn</button>
            <button>Chapter IV — Unapologetic</button>
            <button class="done">Prologue — First Choice</button>
          </div>
        </section>

        <!-- Page 3: Story World Tiles -->
        <section class="page p3">
          <div class="grid">
            <button class="tile"><svg viewBox="0 0 24 24"><path d="M7 2h12a1 1 0 0 1 1 1v15H8a1 1 0 0 0 0 2h12v2H8a3 3 0 0 1-3-3V4a2 2 0 0 1 2-2z"/></svg>Chapters</button>
            <button class="tile"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></svg>Characters</button>
            <button class="tile"><svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm4.5 12.5L17 8l-1.4-1.4-6.1 6.1-2.1-2.1L6 12.1z" fill-rule="evenodd"/></svg>Story Arc</button>
            <button class="tile"><svg viewBox="0 0 24 24"><path d="M3 21l1-5L16 4l4 4L8 20zM17.5 2.5l2-.5 2 2-.5 2z"/></svg>Reader Journal</button>
            <button class="tile"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg>Excerpt</button>
            <button class="tile"><svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm2 9v2h3v-2zm5 0v2h2v-2z"/></svg>Editions</button>
          </div>
        </section>
      </div>

      <div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>
    </section>

  </div>
</div>

<div class="sc" id="sc"></div>

<script>
// Optional URL override (?theme=dark or ?theme=light)
(function(){
  var q = new URLSearchParams(location.search).get('theme');
  if(q === 'dark' || q === 'light') document.documentElement.setAttribute('data-theme', q);
})();

var cube = document.getElementById('cube');
var coverTrigger = document.getElementById('coverTrigger');
var toCover = document.getElementById('toCover');
var themeToggle = document.getElementById('themeToggle');

// Turn cube on text click or Enter/Space
coverTrigger.addEventListener('click', function(){
  cube.classList.add('turned');
});
coverTrigger.addEventListener('keydown', function(e){
  if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    cube.classList.add('turned');
  }
});

// Turn cube back to homepage cover
toCover.addEventListener('click', function(){
  cube.classList.remove('turned');
});

// Toggle between Ash (light) and Pinkish-Sand (dark)
themeToggle.addEventListener('click', function(){
  var root = document.documentElement;
  var isDark = root.getAttribute('data-theme') === 'dark' ||
    (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
});

// Pager & Dots
var pager = document.getElementById('pager'), dots = document.querySelectorAll('#dots i');
pager.addEventListener('scroll', function(){
  var n = Math.round(pager.scrollLeft / pager.clientWidth);
  dots.forEach(function(d, i){ d.classList.toggle('on', i === n); });
});
dots.forEach(function(d, i){
  d.addEventListener('click', function(){
    pager.scrollTo({left: i * pager.clientWidth, behavior: 'smooth'});
  });
});
document.getElementById('list').addEventListener('click', function(e){
  if(e.target.tagName === 'BUTTON') e.target.classList.toggle('done');
});

// Sub-screens content
var sc = document.getElementById('sc'), copies = 1240;
function esc(s){
  return s.replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

var L = {
  'Chapters': [
    ['Prologue: First Choice', '4 min read'],
    ['Chapter I: The Quiet Before', '12 min read'],
    ['Chapter II: What She Kept', '15 min read'],
    ['Chapter III: The Line Drawn', '11 min read'],
    ['Chapter IV: Unapologetic', '18 min read']
  ],
  'Characters': [
    ['Her', 'The one who stopped apologizing'],
    ['The Mirror', 'Everything she used to tolerate'],
    ['The Catalyst', 'The moment that broke the pattern'],
    ['The Aftermath', 'Who stays when she changes']
  ]
};

var T = {
  'Story Arc': [
    'The Accommodation',
    'The Quiet Fracture',
    'The Refusal',
    'The Reckoning',
    'The Choice'
  ]
};

var F = [
  ['Hardcover Edition', 'H', '$28.00', [3,5,4,7,8,10]],
  ['Paperback Edition', 'P', '$18.00', [2,4,6,6,8,9]],
  ['Digital / E-Book', 'E', '$12.99', [4,5,7,8,9,10]],
  ['Signed Collector Copy', 'S', '$45.00', [2,3,5,7,9,10]]
];

function spark(a){
  return '<svg viewBox="0 0 64 22"><polyline points="' + a.map(function(v, i){
    return (i * 12.8) + ',' + (21 - v * 2);
  }).join(' ') + '"/></svg>';
}

function show(cls, html){
  sc.className = 'sc t-' + cls;
  sc.innerHTML = html;
  void sc.offsetHeight;
  sc.classList.add('open');
}

function fmt(n){ return n.toLocaleString('en-US'); }

function openScreen(n){
  if(L[n]){
    show('list',
      '<button class="bk" data-x>←</button>' +
      '<h2>' + n + '</h2>' +
      '<div class="sub">' + L[n].length + ' entries · tap to highlight</div>' +
      '<ul class="ix">' + L[n].map(function(r){
        return '<li><span>' + esc(r[0]) + '</span><em>' + esc(r[1]) + '</em></li>';
      }).join('') + '</ul>' +
      '<div class="add"><input placeholder="Add your note"><button class="ad">Add</button></div>'
    );
  } else if(T[n]){
    show('tl',
      '<button class="bk" data-x>×</button>' +
      '<h2>' + n + '</h2>' +
      '<ol class="tl">' + T[n].map(function(s, i){
        return '<li' + (i === 0 ? ' class="on"' : '') + '>' + s + '</li>';
      }).join('') + '</ol>'
    );
  } else if(n === 'Excerpt' || n === 'Notes'){
    var title = n === 'Excerpt' ? 'Chapter I — Excerpt' : 'Author’s Note';
    var body = n === 'Excerpt'
      ? '<p>She did not slam the door when she left. Slams belong to people who still want to be heard on the way out.</p><p>She simply set the keys down on the table, smoothed the front of her coat, and walked into the street without looking back once to see who was watching.</p>'
      : '<p>This book was written for every version of you that swallowed a “no” to keep the peace.</p><p>Read it slowly. Underline the parts that sting.</p>';
    show('list',
      '<button class="bk" data-x>←</button>' +
      '<h2>' + title + '</h2>' +
      '<div class="sub">Preview</div>' +
      '<div class="excerpt-body">' + body + '</div>'
    );
  } else if(n === 'Reader Journal'){
    var v = '';
    try{ v = localStorage.getItem('novel_jr') || ''; }catch(e){}
    show('tl',
      '<button class="bk" data-x>×</button>' +
      '<div class="jt">READER NOTES</div>' +
      '<div class="js">' + new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}) + '</div>' +
      '<textarea placeholder="Write what stayed with you...">' + esc(v) + '</textarea>' +
      '<div class="jb"><button data-j="c">Clear</button><button data-j="s">Save</button></div>'
    );
  } else if(n === 'Editions' || n === 'Order'){
    show('dune',
      '<div class="top"><div class="av">I</div><button class="bk" data-x>×</button></div>' +
      '<div class="tb">First Print Run · Reserved</div>' +
      '<div class="bal" id="bal">' + fmt(copies) + '<small>COPIES</small></div>' +
      '<div class="acts"><button data-open="Excerpt">Read</button><button data-p>Reserve +1</button></div>' +
      '<div class="fv">Available Formats</div>' +
      F.map(function(f){
        return '<div class="fr"><i>' + f[1] + '</i><b>' + f[0] + '</b>' + spark(f[3]) + '<span>' + f[2] + '</span></div>';
      }).join('')
    );
  }
}

document.addEventListener('click', function(e){
  var t = e.target, x;
  if(x = t.closest('[data-open]')){
    e.preventDefault();
    openScreen(x.dataset.open);
    return;
  }
  if(x = t.closest('.tile')){
    openScreen(x.textContent.trim());
    return;
  }
  if(t.closest('[data-x]')){
    sc.classList.remove('open');
    return;
  }
  if(x = t.closest('.ix li, .tl li')){
    x.classList.toggle('on');
    return;
  }
  if(t.closest('.ad')){
    var i = sc.querySelector('.add input'), v = i.value.trim();
    if(v){
      var li = document.createElement('li');
      li.innerHTML = '<span>' + esc(v) + '</span><em>note</em>';
      sc.querySelector('.ix').appendChild(li);
      i.value = '';
    }
    return;
  }
  if(x = t.closest('[data-j]')){
    var ta = sc.querySelector('textarea');
    if(x.dataset.j === 'c') ta.value = '';
    try{ localStorage.setItem('novel_jr', ta.value); }catch(e){}
    if(x.dataset.j === 's'){
      x.textContent = 'Saved';
      setTimeout(function(){ x.textContent = 'Save'; }, 1200);
    }
    return;
  }
  if(t.closest('[data-p]')){
    copies += 1;
    document.getElementById('bal').innerHTML = fmt(copies) + '<small>COPIES</small>';
  }
});
</script>
</body>
