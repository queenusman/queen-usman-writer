<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Or So She Thought — Queen Usman</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --font-display: 'Cinzel', Georgia, serif;
  --font-serif: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Newsreader', Georgia, serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

  --outer-bg: #F2E4E9;
  --bg: #F6ECEF;
  --bg-subtle: #EDE0E5;
  --panel: #FFFDFD;
  --panel-hover: #FAF2F5;
  --border: #DFC8D0;
  --border-subtle: #ECDCE2;
  --ink: #2B1D24;
  --muted: #6E5260;
  --accent: #9E5672;
  --secondary: #8C4863;
  --callout: rgba(158, 86, 114, 0.12);
  --dot: #D9BFC9;
  --dotOn: #9E5672;
  --page-texture: radial-gradient(circle at 50% 0%, rgba(255, 253, 253, 0.72) 0%, rgba(246, 236, 239, 0) 72%);
  --shadow: 0 10px 28px -6px rgba(92, 42, 62, 0.12), 0 2px 8px rgba(92, 42, 62, 0.05);

  --card-w: 100vw;
  --card-h: 100dvh;
  --card-r: 0px;

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

@media (min-width: 600px) {
  :root {
    --card-w: min(390px, 88vw);
    --card-h: min(780px, 90vh);
    --card-r: 38px;
  }
}

*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  min-height: 100dvh;
  margin: 0;
  padding: 0;
  background: var(--outer-bg);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.frame {
  position: relative;
  width: var(--card-w);
  height: var(--card-h);
  border-radius: var(--card-r);
  background: var(--bg);
  background-image: var(--page-texture);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Opening Home Screen: Or So She Thought */
.home-view {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  text-align: center;
  padding: 28px 24px 34px;
  background: var(--bg);
  background-image: var(--page-texture);
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  transition: opacity 0.32s ease, transform 0.32s ease, visibility 0.32s;
}

.home-view.hidden {
  opacity: 0;
  transform: translateY(-10px);
  visibility: hidden;
  pointer-events: none;
}

.title-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding-top: 8px;
}

.eyebrow {
  font-family: var(--font-sans);
  font-size: 0.625rem;
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}

.title-rule {
  width: 36px;
  height: 1px;
  background: var(--border);
  margin-top: 8px;
}

.title-center {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 16px 0;
}

.novel-title {
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 7.5vw, 2.75rem);
  font-weight: 400;
  letter-spacing: 0.14em;
  line-height: 1.18;
  text-transform: uppercase;
  color: var(--ink);
  margin: 0;
}

.title-bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding-bottom: 6px;
}

.byline {
  font-family: var(--font-sans);
  font-size: 0.625rem;
  font-weight: 500;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}

.enter-label {
  font-family: var(--font-sans);
  font-size: 0.5625rem;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--accent);
}

/* Inner Novel Pager */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 4px;
  flex-shrink: 0;
}

.back-home {
  background: none;
  border: 0;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 1.5rem;
  line-height: 1;
  min-width: 44px;
  min-height: 44px;
  display: grid;
  place-items: center;
  justify-content: start;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}

.pager {
  flex: 1;
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  min-height: 0;
  touch-action: pan-x pan-y;
}

.pager::-webkit-scrollbar {
  display: none;
}

.page {
  flex: 0 0 100%;
  scroll-snap-align: start;
  padding: 16px 22px 20px;
  display: flex;
  flex-direction: column;
}

.p1 {
  justify-content: center;
}

.p1 a {
  font-family: var(--font-display);
  font-size: clamp(1.55rem, 6vw, 1.95rem);
  font-weight: 500;
  letter-spacing: 0.04em;
  line-height: 1.65;
  color: var(--ink);
  text-decoration: none;
  padding-left: 10px;
  touch-action: manipulation;
}

.p1 a:hover {
  color: var(--accent);
}

.p2 {
  justify-content: center;
}

.list {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px 16px;
  box-shadow: var(--shadow);
}

.list button {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 0.95rem;
  font-weight: 500;
  line-height: 1.35;
  padding: 13px 0;
  cursor: pointer;
  touch-action: manipulation;
}

.list button.done {
  color: var(--muted);
  text-decoration: line-through;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: auto 0;
}

.tile {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  aspect-ratio: 1 / 1;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-start;
  gap: 10px;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 0.9rem;
  font-weight: 600;
  line-height: 1.25;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: var(--shadow);
}

.tile:hover {
  background: var(--panel-hover);
  border-color: var(--accent);
}

.tile svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

.dots {
  display: flex;
  justify-content: center;
  gap: 9px;
  padding: 8px 0 22px;
  flex-shrink: 0;
}

.dots i {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--dot);
  transition: background 0.2s;
  cursor: pointer;
  touch-action: manipulation;
}

.dots i.on {
  background: var(--dotOn);
}

/* Slide-Up Sub-Screens */
.sc {
  position: absolute;
  inset: 0;
  z-index: 25;
  overflow-y: auto;
  padding: 18px 24px 24px;
  transform: translateY(100%);
  visibility: hidden;
  transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.35s;
  background: var(--bg);
  background-image: var(--page-texture);
  color: var(--ink);
  font-family: var(--font-body);
}

.sc.open {
  transform: none;
  visibility: visible;
}

.sc button {
  font-family: var(--font-sans);
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

.bk {
  background: none;
  border: 0;
  font-size: 1.75rem;
  line-height: 1;
  min-width: 44px;
  min-height: 44px;
  display: inline-grid;
  place-items: center;
  justify-content: start;
  padding: 0 10px 0 0;
}

.sc h2 {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  margin: 16px 0 4px;
}

.sub {
  font-family: var(--font-sans);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--secondary);
  margin-bottom: 18px;
}

.ix {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--border);
}

.ix li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 6px;
  border-bottom: 1px solid var(--border-subtle);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.5;
  cursor: pointer;
  touch-action: manipulation;
  transition: background 0.2s;
}

.ix li em {
  font-style: normal;
  font-family: var(--font-sans);
  font-size: 0.75rem;
  color: var(--muted);
}

.ix li.on {
  background: var(--accent);
  color: var(--panel);
}

.ix li.on em {
  color: var(--panel);
  opacity: 0.85;
}

.add {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.add input {
  flex: 1;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-body);
  font-size: 1rem;
  padding: 8px 2px;
  outline: 0;
  color: var(--ink);
}

.add button,
.ui-btn {
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0 16px;
  font-family: var(--font-sans);
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.tl {
  list-style: none;
  margin: 26px 0 0;
  padding: 0 0 0 44px;
  position: relative;
}

.tl:before {
  content: "";
  position: absolute;
  left: 10px;
  top: 14px;
  bottom: 14px;
  width: 1px;
  background: var(--border);
}

.tl li {
  position: relative;
  font-family: var(--font-serif);
  font-size: 1.35rem;
  font-weight: 400;
  line-height: 1.45;
  padding: 14px 0;
  cursor: pointer;
  touch-action: manipulation;
}

.tl li:before {
  content: "";
  position: absolute;
  left: -39px;
  top: 50%;
  width: 9px;
  height: 9px;
  margin-top: -4.5px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--accent);
  transition: box-shadow 0.25s, background 0.25s;
}

.tl li.on {
  font-weight: 600;
  font-style: italic;
  color: var(--accent);
}

.tl li.on:before {
  background: var(--accent);
  box-shadow: 0 0 0 5px var(--callout);
}

.jt {
  font-family: var(--font-display);
  font-size: 1.65rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-align: center;
  margin-top: 20px;
}

.js {
  font-family: var(--font-sans);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  text-align: center;
  color: var(--secondary);
  margin: 8px 0 20px;
}

.sc textarea {
  width: 100%;
  height: 40vh;
  background: transparent;
  border: 0;
  border-top: 1px solid var(--border);
  padding: 16px 2px;
  font-family: var(--font-body);
  font-size: 1.1rem;
  line-height: 1.75;
  color: var(--ink);
  outline: 0;
  resize: none;
}

.jb {
  display: flex;
  gap: 10px;
  border-top: 1px solid var(--border);
  padding-top: 16px;
}

.jb button {
  flex: 1;
  height: 42px;
}

.excerpt-body {
  margin-top: 18px;
  border-top: 1px solid var(--border);
  padding-top: 20px;
  font-family: var(--font-body);
  font-size: 1.1rem;
  line-height: 1.78;
}

.excerpt-body p {
  text-align: justify;
  margin: 0 0 1.5rem;
}

.excerpt-body p:first-of-type::first-letter {
  font-family: var(--font-display);
  font-size: 3rem;
  float: left;
  line-height: 0.82;
  padding-top: 4px;
  padding-right: 11px;
  color: var(--accent);
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.av {
  width: 36px;
  height: 36px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 0.875rem;
  font-weight: 600;
}

.tb {
  font-family: var(--font-sans);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--secondary);
  margin-top: 24px;
}

.bal {
  font-family: var(--font-display);
  font-size: 2.5rem;
  font-weight: 400;
  letter-spacing: 0.08em;
  line-height: 1.12;
  margin: 6px 0 0;
}

.bal small {
  font-family: var(--font-sans);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--muted);
  margin-left: 6px;
}

.acts {
  display: flex;
  gap: 12px;
  margin: 22px 0 26px;
}

.acts button {
  flex: 1;
  height: 44px;
}

.fv {
  font-family: var(--font-sans);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--secondary);
  margin-bottom: 12px;
}

.fr {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--panel);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 13px 14px;
  margin-bottom: 10px;
}

.fr i {
  width: 36px;
  height: 36px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  color: var(--accent);
  font-family: var(--font-display);
  font-size: 0.85rem;
  font-weight: 600;
  font-style: normal;
}

.fr b {
  flex: 1;
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 500;
}

.fr span {
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--muted);
}

.fr svg {
  width: 64px;
  height: 22px;
  fill: none;
  stroke: var(--accent);
  stroke-width: 1.6;
}
</style>
</head>
<body>

<div class="frame">
  <!-- Home Screen: Or So She Thought -->
  <main class="home-view" id="homeView" role="button" tabindex="0" aria-label="Enter Or So She Thought">
    <div class="title-top">
      <p class="eyebrow">A Royal Psychological Novel</p>
      <span class="title-rule" aria-hidden="true"></span>
    </div>

    <div class="title-center">
      <h1 class="novel-title">OR SO<br>SHE<br>THOUGHT</h1>
    </div>

    <div class="title-bottom">
      <p class="byline">By Queen Usman</p>
      <span class="enter-label">Enter</span>
    </div>
  </main>

  <div class="top-bar">
    <button type="button" class="back-home" id="backHome" aria-label="Back to title">←</button>
  </div>

  <div class="pager" id="pager">
    <section class="page p1">
      <a href="#" data-open="Excerpt">Excerpt</a>
      <a href="#" data-open="Chapters">Chapters</a>
      <a href="#" data-open="Characters">Characters</a>
      <a href="#" data-open="Notes">Author Notes</a>
      <a href="#" data-open="Order">Get the Book</a>
    </section>

    <section class="page p2">
      <div class="list" id="list">
        <button type="button">Chapter I — The Quiet Before</button>
        <button type="button">Chapter II — What She Kept</button>
        <button type="button">Chapter III — The Line Drawn</button>
        <button type="button">Chapter IV — Unapologetic</button>
        <button type="button" class="done">Prologue — First Choice</button>
      </div>
    </section>

    <section class="page p3">
      <div class="grid">
        <button type="button" class="tile" data-open="Chapters"><svg viewBox="0 0 24 24"><path d="M7 2h12a1 1 0 0 1 1 1v15H8a1 1 0 0 0 0 2h12v2H8a3 3 0 0 1-3-3V4a2 2 0 0 1 2-2z"/></svg>Chapters</button>
        <button type="button" class="tile" data-open="Characters"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></svg>Characters</button>
        <button type="button" class="tile" data-open="Story Arc"><svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm4.5 12.5L17 8l-1.4-1.4-6.1 6.1-2.1-2.1L6 12.1z" fill-rule="evenodd"/></svg>Story Arc</button>
        <button type="button" class="tile" data-open="Reader Journal"><svg viewBox="0 0 24 24"><path d="M3 21l1-5L16 4l4 4L8 20zM17.5 2.5l2-.5 2 2-.5 2z"/></svg>Reader Journal</button>
        <button type="button" class="tile" data-open="Excerpt"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg>Excerpt</button>
        <button type="button" class="tile" data-open="Editions"><svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm2 9v2h3v-2zm5 0v2h2v-2z"/></svg>Editions</button>
      </div>
    </section>
  </div>

  <div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>
  <div class="sc" id="sc"></div>
</div>

<script>
var homeView = document.getElementById('homeView');
var backHome = document.getElementById('backHome');

function openPages(){
  homeView.classList.add('hidden');
}

function openHome(){
  sc.classList.remove('open');
  homeView.classList.remove('hidden');
}

homeView.addEventListener('click', openPages);
homeView.addEventListener('keydown', function(e){
  if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    openPages();
  }
});
backHome.addEventListener('click', openHome);

var pager = document.getElementById('pager'), dots = document.querySelectorAll('#dots i');
pager.addEventListener('scroll', function(){
  var n = Math.round(pager.scrollLeft / pager.clientWidth);
  dots.forEach(function(d, i){ d.classList.toggle('on', i === n); });
});
dots.forEach(function(d, i){
  d.addEventListener('click', function(){
    pager.scrollTo({left: i * pager.clientWidth, behavior: 'smooth'});
  });
});
document.getElementById('list').addEventListener('click', function(e){
  if(e.target.tagName === 'BUTTON') e.target.classList.toggle('done');
});

var sc = document.getElementById('sc'), copies = 1240;
function esc(s){
  return s.replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

var L = {
  'Chapters': [
    ['Prologue: First Choice', '4 min read'],
    ['Chapter I: The Quiet Before', '12 min read'],
    ['Chapter II: What She Kept', '15 min read'],
    ['Chapter III: The Line Drawn', '11 min read'],
    ['Chapter IV: Unapologetic', '18 min read']
  ],
  'Characters': [
    ['Her', 'The one who stopped apologizing'],
    ['The Mirror', 'Everything she used to tolerate'],
    ['The Catalyst', 'The moment that broke the pattern'],
    ['The Aftermath', 'Who stays when she changes']
  ]
};

var T = {
  'Story Arc': [
    'The Accommodation',
    'The Quiet Fracture',
    'The Refusal',
    'The Reckoning',
    'The Choice'
  ]
};

var F = [
  ['Hardcover Edition', 'H', '$28.00', [3,5,4,7,8,10]],
  ['Paperback Edition', 'P', '$18.00', [2,4,6,6,8,9]],
  ['Digital / E-Book', 'E', '$12.99', [4,5,7,8,9,10]],
  ['Signed Collector Copy', 'S', '$45.00', [2,3,5,7,9,10]]
];

function spark(a){
  return '<svg viewBox="0 0 64 22"><polyline points="' + a.map(function(v, i){
    return (i * 12.8) + ',' + (21 - v * 2);
  }).join(' ') + '"/></svg>';
}

function show(cls, html){
  sc.className = 'sc t-' + cls;
  sc.innerHTML = html;
  void sc.offsetHeight;
  sc.classList.add('open');
}

function fmt(n){ return n.toLocaleString('en-US'); }

function openScreen(n){
  if(L[n]){
    show('list',
      '<button type="button" class="bk" data-x>←</button>' +
      '<h2>' + n + '</h2>' +
      '<div class="sub">' + L[n].length + ' entries · tap to highlight</div>' +
      '<ul class="ix">' + L[n].map(function(r){
        return '<li><span>' + esc(r[0]) + '</span><em>' + esc(r[1]) + '</em></li>';
      }).join('') + '</ul>' +
      '<div class="add"><input placeholder="Add your note"><button type="button" class="ad">Add</button></div>'
    );
  } else if(T[n]){
    show('tl',
      '<button type="button" class="bk" data-x>×</button>' +
      '<h2>' + n + '</h2>' +
      '<ol class="tl">' + T[n].map(function(s, i){
        return '<li' + (i === 0 ? ' class="on"' : '') + '>' + s + '</li>';
      }).join('') + '</ol>'
    );
  } else if(n === 'Excerpt' || n === 'Notes'){
    var title = n === 'Excerpt' ? 'Chapter I — Excerpt' : 'Author’s Note';
    var body = n === 'Excerpt'
      ? '<p>She did not slam the door when she left. Slams belong to people who still want to be heard on the way out.</p><p>She simply set the keys down on the table, smoothed the front of her coat, and walked into the street without looking back once to see who was watching.</p>'
      : '<p>This book was written for every version of you that swallowed a “no” to keep the peace.</p><p>Read it slowly. Underline the parts that sting.</p>';
    show('list',
      '<button type="button" class="bk" data-x>←</button>' +
      '<h2>' + title + '</h2>' +
      '<div class="sub">Preview</div>' +
      '<div class="excerpt-body">' + body + '</div>'
    );
  } else if(n === 'Reader Journal'){
    var v = '';
    try{ v = localStorage.getItem('novel_jr') || ''; }catch(e){}
    show('tl',
      '<button type="button" class="bk" data-x>×</button>' +
      '<div class="jt">READER NOTES</div>' +
      '<div class="js">' + new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}) + '</div>' +
      '<textarea placeholder="Write what stayed with you...">' + esc(v) + '</textarea>' +
      '<div class="jb"><button type="button" class="ui-btn" data-j="c">Clear</button><button type="button" class="ui-btn" data-j="s">Save</button></div>'
    );
  } else if(n === 'Editions' || n === 'Order'){
    show('dune',
      '<div class="top"><div class="av">Q</div><button type="button" class="bk" data-x>×</button></div>' +
      '<div class="tb">First Print Run · Reserved</div>' +
      '<div class="bal" id="bal">' + fmt(copies) + '<small>COPIES</small></div>' +
      '<div class="acts"><button type="button" class="ui-btn" data-open="Excerpt">Read</button><button type="button" class="ui-btn" data-p>Reserve +1</button></div>' +
      '<div class="fv">Available Formats</div>' +
      F.map(function(f){
        return '<div class="fr"><i>' + f[1] + '</i><b>' + f[0] + '</b>' + spark(f[3]) + '<span>' + f[2] + '</span></div>';
      }).join('')
    );
  }
}

document.addEventListener('click', function(e){
  var t = e.target, x;
  if(x = t.closest('[data-open]')){
    e.preventDefault();
    openScreen(x.dataset.open);
    return;
  }
  if(x = t.closest('.tile')){
    openScreen(x.textContent.trim());
    return;
  }
  if(t.closest('[data-x]')){
    sc.classList.remove('open');
    return;
  }
  if(x = t.closest('.ix li, .tl li')){
    x.classList.toggle('on');
    return;
  }
  if(t.closest('.ad')){
    var i = sc.querySelector('.add input'), v = i.value.trim();
    if(v){
      var li = document.createElement('li');
      li.innerHTML = '<span>' + esc(v) + '</span><em>note</em>';
      sc.querySelector('.ix').appendChild(li);
      i.value = '';
    }
    return;
  }
  if(x = t.closest('[data-j]')){
    var ta = sc.querySelector('textarea');
    if(x.dataset.j === 'c') ta.value = '';
    try{ localStorage.setItem('novel_jr', ta.value); }catch(e){}
    if(x.dataset.j === 's'){
      x.textContent = 'Saved';
      setTimeout(function(){ x.textContent = 'Save'; }, 1200);
    }
    return;
  }
  if(t.closest('[data-p]')){
    copies += 1;
    document.getElementById('bal').innerHTML = fmt(copies) + '<small>COPIES</small>';
  }
});
</script>
</body>
</html>
