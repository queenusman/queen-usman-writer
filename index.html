title: The Questions
---

\x3C!-- Drafted from the novel's stated concerns. Revise in your own words. -->

These are the questions the novel keeps returning to. It does not settle them. It lets them be lived through.

## Where does duty end and freedom begin, and who decides?

## What does power owe to the people it governs, and to the person who holds it?

## When does protection become control?

## Can love and obligation be told apart from the inside?

## How much of a choice is yours when the expectation was arranged before you could choose?

## What does autonomy cost inside a family?
`,ig=`---
title: The Story
---

*Or So She Thought* is a psychological literary novel set in Norwyn, an island kingdom ruled by an absolute monarchy, where the crown passes through the female line.

Its protagonist is Elizabeth, also known as Elisabeta.

The novel is concerned with duty and freedom, power and responsibility, family and expectation, autonomy, love and obligation, protection and control. Above all it is concerned with how complicated a personal choice becomes when it is made inside all of these at once.

**Placeholder.** A fuller, spoiler-free introduction to the story, in the author's own words, belongs here.
