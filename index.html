<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novel</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
1. DESIGN TOKENS (COLORS, FONTS, SPACING & RADII)
   ========================================================================== */
:root {
  /* --- Font Families --- */
  --font-display: 'Cinzel', Georgia, serif;
  --font-serif: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Newsreader', Georgia, serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: ui-monospace, Menlo, Consolas, monospace;

  /* --- Single Blush / Rose Palette --- */
  --color-bg: #F6ECEF;
  --color-bg-subtle: #EDE0E5;
  --color-panel: #FFFDFD;
  --color-panel-hover: #FAF2F5;
  --color-border: #DFC8D0;
  --color-border-subtle: #ECDCE2;
  --color-text: #2B1D24;
  --color-text-muted: #6E5260;
  --color-text-faint: #8F6F7F;
  --color-accent: #9E5672;
  --color-secondary: #8C4863;
  --color-callout-bg: rgba(158, 86, 114, 0.12);
  --header-bg: rgba(246, 236, 239, 0.94);
  --footer-bg: #EDE0E5;
  --primary-btn-bg: #FFFDFD;
  --primary-btn-text: #2B1D24;
  --primary-btn-border: #D9BFC9;
  --selection-bg: #E8B8C8;
  --selection-text: #2B1D24;
  --page-texture: radial-gradient(circle at 50% 0%, rgba(255, 253, 253, 0.72) 0%, rgba(246, 236, 239, 0) 72%);
  --card-shadow: 0 10px 28px -6px rgba(92, 42, 62, 0.12), 0 2px 8px rgba(92, 42, 62, 0.05);

  /* --- Scriptorium Archive Tokens --- */
  --room: #EDE0E5;
  --room-hi: #FFFDFD;
  --case-bg: #E5D3DA;
  --case-hi: #F6ECEF;
  --shelf-back: #D9C3CC;
  --plank-top: #FFFDFD;
  --plank-mid: #EDE0E5;
  --plank-bot: #D9C3CC;
  --gilt: #9E5672;
  --gilt-dim: #B5738D;
  --plate-bg-1: #FFFDFD;
  --plate-bg-2: #F6ECEF;
  --plate-text: #2B1D24;
  --plate-border: #DFC8D0;
  --ink: #2B1D24;
  --ink-muted: #6E5260;
  --vellum: #FFFDFD;
  --vellum-edge: #ECDCE2;
  --rubric: #8C4863;
  --ui: #2B1D24;
  --ui-dim: #6E5260;
  --btn-bg: rgba(255, 253, 253, 0.92);
  --btn-hover: rgba(250, 242, 245, 0.98);
  --btn-border: #D9BFC9;
  --btn-border-hover: #9E5672;
  --foil-gradient: linear-gradient(100deg, #9E5672 0%, #D49BB0 35%, #8C4863 65%, #C789A1 100%);

  /* --- Cinematic Intro Tokens --- */
  --qu-bg: #F6ECEF;
  --qu-charcoal: #EDE0E5;
  --qu-panel: rgba(255, 253, 253, 0.9);
  --qu-border: rgba(158, 86, 114, 0.28);
  --qu-accent: #9E5672;
  --qu-secondary: #8C4863;
  --qu-text: #2B1D24;
  --qu-text-muted: rgba(110, 82, 96, 0.85);
  --qu-reveal: #F6ECEF;

  /* --- Spacing, Radii & Layout Scale --- */
  --u: 8px;
  --radius-card: 2px;
  --radius-case: 4px;
  --radius-pill: 7px;
  --radius-btn: 8px;
  --radius-control: 10px;
  --radius-full: 999px;
  --container-prose: 48rem;
  --container-gateway: 56rem;
  --container-header: 64rem;
  --container-archive: 72rem;

  /* --- Viewport Card Frame --- */
  --outer-bg: #F2E4E9;
  --card-w: 100vw;
  --card-h: 100dvh;
  --card-r: 0px;

  box-sizing: border-box;
  color-scheme: light;
}

/* Desktop View: Tall Vertical Portrait Rectangle with Curved Edges */
@media (min-width: 600px) {
  :root {
    --card-w: min(390px, 88vw);
    --card-h: min(780px, 90vh);
    --card-r: 38px;
  }
}

/* ==========================================================================
2. BASE & EDITORIAL TYPOGRAPHY SCALE
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  min-height: 100dvh;
  margin: 0;
  padding: 0;
  background-color: var(--outer-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: 1.08rem;
  line-height: 1.76;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.25s ease, color 0.25s ease;
}

::selection {
  background-color: var(--selection-bg);
  color: var(--selection-text);
}

/* Display & Editorial Headings */
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(2.25rem, 5vw, 3.75rem);
  font-weight: 400;
  letter-spacing: 0.16em;
  line-height: 1.12;
  text-transform: uppercase;
}

.section-title {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3vw, 1.875rem);
  font-weight: 600;
  letter-spacing: 0.04em;
}

.eyebrow-label {
  font-family: var(--font-sans);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--color-secondary);
}

/* Prose & Chapter Reading Body */
.prose-body {
  font-family: var(--font-body);
  font-size: 1.08rem;
  line-height: 1.76;
}

.prose-body-lg {
  font-family: var(--font-body);
  font-size: 1.125rem;
  line-height: 1.78;
}

.character-bio {
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.7;
}

.chapter-paragraph,
.entry-paragraph {
  text-align: justify;
  text-justify: inter-word;
  margin-bottom: 1.65rem;
}

.chapter-paragraph:first-of-type::first-letter,
.entry-paragraph:first-of-type::first-letter {
  font-family: var(--font-display);
  font-size: 3.1rem;
  float: left;
  line-height: 0.82;
  padding-top: 4px;
  padding-right: 11px;
  padding-bottom: 2px;
  color: var(--color-accent);
  font-weight: 400;
}

/* ==========================================================================
3. UI COMPONENTS & SPACING
   ========================================================================== */
.book-card {
  background-color: var(--color-panel);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  box-shadow: var(--card-shadow);
  padding: 2rem;
  position: relative;
}

.ui-btn {
  background-color: var(--primary-btn-bg);
  color: var(--primary-btn-text);
  border: 1px solid var(--primary-btn-border);
  border-radius: var(--radius-btn);
  padding: 0.5rem 1rem;
  font-family: var(--font-sans);
  font-size: 0.625rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
  cursor: pointer;
}

.ui-btn:hover {
  border-color: var(--color-accent);
  color: var(--color-accent);
}

/* ==========================================================================
4. CINEMATIC INTRO & SCRIPTORIUM SCALE TOKENS
   ========================================================================== */
.qu-name {
  font-family: var(--font-serif);
  font-size: clamp(2.2rem, 6.8vw, 4.5rem);
  font-weight: 400;
  letter-spacing: 0.22em;
  color: var(--qu-text);
}

.qu-tag {
  font-family: var(--font-serif);
  font-size: clamp(1.15rem, 2.5vw, 1.55rem);
  font-style: italic;
  letter-spacing: 0.08em;
  color: var(--qu-text-muted);
}

.scriptorium-book {
  font-size: 18px;
}

.scriptorium-book .tx {
  font-size: 1em;
  line-height: 1.5;
}

.scriptorium-book .tx p.first::first-letter {
  font-family: var(--font-display);
  font-size: 2.8em;
  line-height: 0.82;
  color: var(--rubric);
}

.scriptorium-book .rh {
  font-family: var(--font-sans);
  font-size: 0.58em;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--rubric);
}

.scriptorium-book .ft {
  font-family: var(--font-serif);
  font-size: 0.78em;
  font-style: italic;
  color: var(--ink-muted);
}

/* ==========================================================================
5. 3D CUBE STAGE, COVER & INNER PAGES
   ========================================================================== */
.stage {
  position: relative;
  width: var(--card-w);
  height: var(--card-h);
  perspective: 1400px;
}

.cube {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  will-change: transform;
  transition: transform 0.85s cubic-bezier(0.22, 0.82, 0.24, 1);
  transform: translateZ(calc(var(--card-w) * -0.5)) rotateY(0deg);
}

.cube.turned {
  transform: translateZ(calc(var(--card-w) * -0.5)) rotateY(-90deg);
}

.face {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-color: var(--color-bg);
  background-image: var(--page-texture);
  border-radius: var(--card-r);
  box-shadow: var(--card-shadow);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}

.face-front {
  transform: rotateY(0deg) translateZ(calc(var(--card-w) * 0.5));
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 32px) 30px calc(env(safe-area-inset-bottom, 0px) + 32px);
  z-index: 2;
  pointer-events: auto;
}

.face-right {
  transform: rotateY(90deg) translateZ(calc(var(--card-w) * 0.5));
  display: flex;
  flex-direction: column;
  z-index: 1;
  pointer-events: none;
}

.cube.turned .face-front {
  pointer-events: none;
  z-index: 1;
}

.cube.turned .face-right {
  pointer-events: auto;
  z-index: 3;
}

.cube.settled .face-front {
  display: none;
}

/* Pure Typographic Cover */
.cover-copy {
  width: 100%;
  cursor: pointer;
  user-select: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.cover-copy:active {
  opacity: 0.72;
  transform: scale(0.99);
}

.cover-copy p {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 1.75rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1.35;
  color: var(--color-text);
}

.cover-copy p + p {
  margin-top: 1rem;
}

/* Inner Novel Pages */
.top-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 22px) 22px 8px;
  position: relative;
  z-index: 5;
  flex-shrink: 0;
}

.back-cover {
  background: none;
  border: 0;
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: 1.5rem;
  line-height: 1;
  min-width: 40px;
  min-height: 40px;
  display: grid;
  place-items: center;
  justify-content: start;
  padding: 0;
  cursor: pointer;
}

.pager {
  flex: 1;
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  min-height: 0;
}

.pager::-webkit-scrollbar {
  display: none;
}

.page {
  flex: 0 0 100%;
  scroll-snap-align: start;
  padding: 14px 22px 20px;
  display: flex;
  flex-direction: column;
}

.p1 {
  justify-content: center;
}

.p1 a {
  display: block;
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3vw, 1.875rem);
  font-weight: 500;
  letter-spacing: 0.04em;
  line-height: 1.65;
  color: var(--color-text);
  text-decoration: none;
  padding-left: 8px;
  cursor: pointer;
}

.p1 a:hover {
  color: var(--color-accent);
}

.p2 {
  justify-content: center;
}

.list {
  background: var(--color-panel);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-control);
  padding: 18px;
  box-shadow: var(--card-shadow);
}

.list button {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: 0.95rem;
  font-weight: 500;
  line-height: 1.35;
  padding: 13px 0;
  cursor: pointer;
}

.list button.done {
  color: var(--color-text-muted);
  text-decoration: line-through;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: auto 0;
}

.tile {
  background: var(--color-panel);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-control);
  aspect-ratio: 1 / 1;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-start;
  gap: 10px;
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: 0.9rem;
  font-weight: 600;
  line-height: 1.25;
  text-align: left;
  cursor: pointer;
  box-shadow: var(--card-shadow);
}

.tile:hover {
  background: var(--color-panel-hover);
  border-color: var(--color-accent);
}

.tile svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

.dots {
  display: flex;
  justify-content: center;
  gap: 9px;
  padding: 8px 0 calc(env(safe-area-inset-bottom, 0px) + 20px);
  flex-shrink: 0;
}

.dots i {
  width: 7px;
  height: 7px;
  border-radius: var(--radius-full);
  background: var(--color-border);
  transition: background 0.2s;
  cursor: pointer;
}

.dots i.on {
  background: var(--color-accent);
}

/* ==========================================================================
6. SLIDE-UP SUB-SCREENS
   ========================================================================== */
.sc {
  position: fixed;
  top: 50%;
  left: 50%;
  width: var(--card-w);
  height: var(--card-h);
  border-radius: var(--card-r);
  z-index: 50;
  overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 22px) 24px calc(env(safe-area-inset-bottom, 0px) + 24px);
  transform: translate(-50%, 65%);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease, visibility 0.38s;
  color: var(--color-text);
  background-color: var(--color-bg);
  background-image: var(--page-texture);
  box-shadow: var(--card-shadow);
  font-family: var(--font-body);
}

.sc.open {
  transform: translate(-50%, -50%);
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.sc button {
  font-family: var(--font-sans);
  color: inherit;
  cursor: pointer;
}

.bk {
  background: none;
  border: 0;
  font-size: 1.75rem;
  line-height: 1;
  padding: 0 10px 0 0;
}

.sc h2 {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3vw, 1.875rem);
  font-weight: 600;
  letter-spacing: 0.04em;
  margin: 20px 0 4px;
}

.sub {
  font-family: var(--font-sans);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--color-secondary);
  margin-bottom: 18px;
}

.ix {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--color-border);
}

.ix li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 6px;
  border-bottom: 1px solid var(--color-border-subtle);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.7;
  cursor: pointer;
  transition: background 0.2s;
}

.ix li em {
  font-style: normal;
  font-family: var(--font-sans);
  font-size: 0.75rem;
  color: var(--color-text-muted);
}

.ix li.on {
  background: var(--color-accent);
  color: var(--color-panel);
}

.ix li.on em {
  color: var(--color-panel);
  opacity: 0.85;
}

.add {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.add input {
  flex: 1;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--color-border);
  font-family: var(--font-body);
  font-size: 1rem;
  padding: 8px 2px;
  outline: 0;
  color: var(--color-text);
}

.tl {
  list-style: none;
  margin: 26px 0 0;
  padding: 0 0 0 44px;
  position: relative;
}

.tl:before {
  content: "";
  position: absolute;
  left: 10px;
  top: 14px;
  bottom: 14px;
  width: 1px;
  background: var(--color-border);
}

.tl li {
  position: relative;
  font-family: var(--font-serif);
  font-size: 1.35rem;
  font-weight: 400;
  line-height: 1.45;
  padding: 14px 0;
  cursor: pointer;
}

.tl li:before {
  content: "";
  position: absolute;
  left: -39px;
  top: 50%;
  width: 9px;
  height: 9px;
  margin-top: -4.5px;
  border-radius: var(--radius-full);
  background: var(--color-panel);
  border: 1px solid var(--color-accent);
  transition: box-shadow 0.25s, background 0.25s;
}

.tl li.on {
  font-weight: 600;
  font-style: italic;
  color: var(--color-accent);
}

.tl li.on:before {
  background: var(--color-accent);
  box-shadow: 0 0 0 5px var(--color-callout-bg);
}

.jt {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3vw, 1.875rem);
  font-weight: 600;
  letter-spacing: 0.12em;
  text-align: center;
  margin-top: 24px;
}

.js {
  font-family: var(--font-sans);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  text-align: center;
  color: var(--color-secondary);
  margin: 8px 0 20px;
}

.sc textarea {
  width: 100%;
  height: 40vh;
  background: transparent;
  border: 0;
  border-top: 1px solid var(--color-border);
  padding: 16px 2px;
  font-family: var(--font-body);
  font-size: 1.125rem;
  line-height: 1.78;
  color: var(--color-text);
  outline: 0;
  resize: none;
}

.jb {
  display: flex;
  gap: 10px;
  border-top: 1px solid var(--color-border);
  padding-top: 16px;
}

.jb button {
  flex: 1;
}

.excerpt-body {
  margin-top: 18px;
  font-family: var(--font-body);
  font-size: 1.125rem;
  line-height: 1.78;
  border-top: 1px solid var(--color-border);
  padding-top: 20px;
}

.excerpt-body p.chapter-paragraph:last-child {
  margin-bottom: 0;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.av {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  background: var(--color-panel);
  border: 1px solid var(--color-border);
  color: var(--color-accent);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 0.875rem;
  font-weight: 600;
}

.tb {
  font-family: var(--font-sans);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--color-secondary);
  margin-top: 24px;
}

.bal {
  font-family: var(--font-display);
  font-size: clamp(2.25rem, 5vw, 3.75rem);
  font-weight: 400;
  letter-spacing: 0.08em;
  line-height: 1.12;
  margin: 6px 0 0;
}

.bal small {
  font-family: var(--font-sans);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--color-text-muted);
  margin-left: 6px;
}

.acts {
  display: flex;
  gap: 12px;
  margin: 22px 0 26px;
}

.acts button {
  flex: 1;
  height: 44px;
}

.fv {
  font-family: var(--font-sans);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--color-secondary);
  margin-bottom: 12px;
}

.fr {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--color-panel);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-control);
  padding: 13px 14px;
  margin-bottom: 10px;
}

.fr i {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  display: grid;
  place-items: center;
  background: var(--color-bg-subtle);
  border: 1px solid var(--color-border);
  color: var(--color-accent);
  font-family: var(--font-display);
  font-size: 0.85rem;
  font-weight: 600;
  font-style: normal;
}

.fr b {
  flex: 1;
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 500;
}

.fr span {
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--color-text-muted);
}

.fr svg {
  width: 64px;
  height: 22px;
  fill: none;
  stroke: var(--color-accent);
  stroke-width: 1.6;
}
</style>
</head>
<body>

<div class="stage">
  <div class="cube" id="cube">

    <!-- FRONT FACE: Pure Homepage Text Only -->
    <main class="face face-front" id="frontFace">
      <div class="cover-copy" id="coverTrigger" role="button" tabindex="0" aria-label="Enter the novel">
        <p>I wrote a novel about woman who finally chooses.</p>
        <p>You may not like how much of you is in her,<br>or how long you've been waiting to be her.</p>
        <p>She's done waiting. You don't have to be.</p>
      </div>
    </main>

    <!-- RIGHT FACE: Rest of the Novel Pages -->
    <section class="face face-right" aria-label="Novel Pages">
      <div class="top-nav">
        <button class="back-cover" id="toCover" aria-label="Back to cover">←</button>
      </div>

      <div class="pager" id="pager">
        <!-- Page 1: Novel Navigation -->
        <section class="page p1">
          <a href="#" data-open="Excerpt">Excerpt</a>
          <a href="#" data-open="Chapters">Chapters</a>
          <a href="#" data-open="Characters">Characters</a>
          <a href="#" data-open="Notes">Author Notes</a>
          <a href="#" data-open="Order">Get the Book</a>
        </section>

        <!-- Page 2: Reader Check-in / Themes -->
        <section class="page p2">
          <div class="list" id="list">
            <button>Chapter I — The Quiet Before</button>
            <button>Chapter II — What She Kept</button>
            <button>Chapter III — The Line Drawn</button>
            <button>Chapter IV — Unapologetic</button>
            <button class="done">Prologue — First Choice</button>
          </div>
        </section>

        <!-- Page 3: Story World Tiles -->
        <section class="page p3">
          <div class="grid">
            <button class="tile" data-open="Chapters"><svg viewBox="0 0 24 24"><path d="M7 2h12a1 1 0 0 1 1 1v15H8a1 1 0 0 0 0 2h12v2H8a3 3 0 0 1-3-3V4a2 2 0 0 1 2-2z"/></svg>Chapters</button>
            <button class="tile" data-open="Characters"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></svg>Characters</button>
            <button class="tile" data-open="Story Arc"><svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm4.5 12.5L17 8l-1.4-1.4-6.1 6.1-2.1-2.1L6 12.1z" fill-rule="evenodd"/></svg>Story Arc</button>
            <button class="tile" data-open="Reader Journal"><svg viewBox="0 0 24 24"><path d="M3 21l1-5L16 4l4 4L8 20zM17.5 2.5l2-.5 2 2-.5 2z"/></svg>Reader Journal</button>
            <button class="tile" data-open="Excerpt"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg>Excerpt</button>
            <button class="tile" data-open="Editions"><svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm2 9v2h3v-2zm5 0v2h2v-2z"/></svg>Editions</button>
          </div>
        </section>
      </div>

      <div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>
    </section>

  </div>
</div>

<div class="sc" id="sc"></div>

<script>
var cube = document.getElementById('cube');
var coverTrigger = document.getElementById('coverTrigger');
var toCover = document.getElementById('toCover');
var turnTimer = null;

function turnToInner(){
  clearTimeout(turnTimer);
  cube.classList.remove('settled');
  cube.classList.add('turned');
  turnTimer = setTimeout(function(){
    if(cube.classList.contains('turned')) cube.classList.add('settled');
  }, 850);
}

function turnToCover(){
  clearTimeout(turnTimer);
  cube.classList.remove('settled');
  void cube.offsetWidth;
  cube.classList.remove('turned');
}

coverTrigger.addEventListener('click', turnToInner);
coverTrigger.addEventListener('keydown', function(e){
  if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    turnToInner();
  }
});

toCover.addEventListener('click', turnToCover);

var pager = document.getElementById('pager'), dots = document.querySelectorAll('#dots i');
pager.addEventListener('scroll', function(){
  var n = Math.round(pager.scrollLeft / pager.clientWidth);
  dots.forEach(function(d, i){ d.classList.toggle('on', i === n); });
});
dots.forEach(function(d, i){
  d.addEventListener('click', function(){
    pager.scrollTo({left: i * pager.clientWidth, behavior: 'smooth'});
  });
});
document.getElementById('list').addEventListener('click', function(e){
  if(e.target.tagName === 'BUTTON') e.target.classList.toggle('done');
});

var sc = document.getElementById('sc'), copies = 1240;
function esc(s){
  return s.replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

var L = {
  'Chapters': [
    ['Prologue: First Choice', '4 min read'],
    ['Chapter I: The Quiet Before', '12 min read'],
    ['Chapter II: What She Kept', '15 min read'],
    ['Chapter III: The Line Drawn', '11 min read'],
    ['Chapter IV: Unapologetic', '18 min read']
  ],
  'Characters': [
    ['Her', 'The one who stopped apologizing'],
    ['The Mirror', 'Everything she used to tolerate'],
    ['The Catalyst', 'The moment that broke the pattern'],
    ['The Aftermath', 'Who stays when she changes']
  ]
};

var T = {
  'Story Arc': [
    'The Accommodation',
    'The Quiet Fracture',
    'The Refusal',
    'The Reckoning',
    'The Choice'
  ]
};

var F = [
  ['Hardcover Edition', 'H', '$28.00', [3,5,4,7,8,10]],
  ['Paperback Edition', 'P', '$18.00', [2,4,6,6,8,9]],
  ['Digital / E-Book', 'E', '$12.99', [4,5,7,8,9,10]],
  ['Signed Collector Copy', 'S', '$45.00', [2,3,5,7,9,10]]
];

function spark(a){
  return '<svg viewBox="0 0 64 22"><polyline points="' + a.map(function(v, i){
    return (i * 12.8) + ',' + (21 - v * 2);
  }).join(' ') + '"/></svg>';
}

function show(cls, html){
  sc.className = 'sc t-' + cls;
  sc.innerHTML = html;
  void sc.offsetHeight;
  sc.classList.add('open');
}

function fmt(n){ return n.toLocaleString('en-US'); }

function openScreen(n){
  if(L[n]){
    show('list',
      '<button class="bk" data-x>←</button>' +
      '<h2>' + n + '</h2>' +
      '<div class="sub">' + L[n].length + ' entries · tap to highlight</div>' +
      '<ul class="ix">' + L[n].map(function(r){
        return '<li><span>' + esc(r[0]) + '</span><em>' + esc(r[1]) + '</em></li>';
      }).join('') + '</ul>' +
      '<div class="add"><input placeholder="Add your note"><button class="ui-btn ad">Add</button></div>'
    );
  } else if(T[n]){
    show('tl',
      '<button class="bk" data-x>×</button>' +
      '<h2>' + n + '</h2>' +
      '<ol class="tl">' + T[n].map(function(s, i){
        return '<li' + (i === 0 ? ' class="on"' : '') + '>' + s + '</li>';
      }).join('') + '</ol>'
    );
  } else if(n === 'Excerpt' || n === 'Notes'){
    var title = n === 'Excerpt' ? 'Chapter I — Excerpt' : 'Author’s Note';
    var body = n === 'Excerpt'
      ? '<p class="chapter-paragraph">She did not slam the door when she left. Slams belong to people who still want to be heard on the way out.</p><p class="chapter-paragraph">She simply set the keys down on the table, smoothed the front of her coat, and walked into the street without looking back once to see who was watching.</p>'
      : '<p class="chapter-paragraph">This book was written for every version of you that swallowed a “no” to keep the peace.</p><p class="chapter-paragraph">Read it slowly. Underline the parts that sting.</p>';
    show('list',
      '<button class="bk" data-x>←</button>' +
      '<h2>' + title + '</h2>' +
      '<div class="sub">Preview</div>' +
      '<div class="excerpt-body prose-body-lg">' + body + '</div>'
    );
  } else if(n === 'Reader Journal'){
    var v = '';
    try{ v = localStorage.getItem('novel_jr') || ''; }catch(e){}
    show('tl',
      '<button class="bk" data-x>×</button>' +
      '<div class="jt">READER NOTES</div>' +
      '<div class="js">' + new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}) + '</div>' +
      '<textarea class="prose-body-lg" placeholder="Write what stayed with you...">' + esc(v) + '</textarea>' +
      '<div class="jb"><button class="ui-btn" data-j="c">Clear</button><button class="ui-btn" data-j="s">Save</button></div>'
    );
  } else if(n === 'Editions' || n === 'Order'){
    show('dune',
      '<div class="top"><div class="av">I</div><button class="bk" data-x>×</button></div>' +
      '<div class="tb">First Print Run · Reserved</div>' +
      '<div class="bal" id="bal">' + fmt(copies) + '<small>COPIES</small></div>' +
      '<div class="acts"><button class="ui-btn" data-open="Excerpt">Read</button><button class="ui-btn" data-p>Reserve +1</button></div>' +
      '<div class="fv">Available Formats</div>' +
      F.map(function(f){
        return '<div class="fr"><i>' + f[1] + '</i><b>' + f[0] + '</b>' + spark(f[3]) + '<span>' + f[2] + '</span></div>';
      }).join('')
    );
  }
}

document.addEventListener('click', function(e){
  var t = e.target, x;
  if(x = t.closest('[data-open]')){
    e.preventDefault();
    openScreen(x.dataset.open);
    return;
  }
  if(x = t.closest('.tile')){
    openScreen(x.textContent.trim());
    return;
  }
  if(t.closest('[data-x]')){
    sc.classList.remove('open');
    return;
  }
  if(x = t.closest('.ix li, .tl li')){
    x.classList.toggle('on');
    return;
  }
  if(t.closest('.ad')){
    var i = sc.querySelector('.add input'), v = i.value.trim();
    if(v){
      var li = document.createElement('li');
      li.innerHTML = '<span>' + esc(v) + '</span><em>note</em>';
      sc.querySelector('.ix').appendChild(li);
      i.value = '';
    }
    return;
  }
  if(x = t.closest('[data-j]')){
    var ta = sc.querySelector('textarea');
    if(x.dataset.j === 'c') ta.value = '';
    try{ localStorage.setItem('novel_jr', ta.value); }catch(e){}
    if(x.dataset.j === 's'){
      x.textContent = 'Saved';
      setTimeout(function(){ x.textContent = 'Save'; }, 1200);
    }
    return;
  }
  if(t.closest('[data-p]')){
    copies += 1;
    document.getElementById('bal').innerHTML = fmt(copies) + '<small>COPIES</small>';
  }
});
</script>
</body>
</html>
